<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;height:100dvh;overflow:hidden;background:#fff;color:#102a43;font-family:system-ui,Roboto,sans-serif}
body{display:flex;flex-direction:column;touch-action:manipulation}
#top{display:flex;align-items:center;gap:10px;padding:5px 10px;background:#0b3d91;color:#fff;flex:0 0 auto}
#top .sc{display:flex;align-items:center;gap:8px;font-size:30px;font-weight:800;white-space:nowrap;background:#082c6c;border-radius:8px;padding:0 12px;height:46px}

.og{display:flex;gap:5px}
#g{flex:1;display:grid;grid-template-columns:44px minmax(110px,1.3fr) repeat(5,1fr) 6px 44px .9fr;grid-template-rows:auto;grid-auto-rows:1fr;min-height:0}
#g>div{border-bottom:1px solid #cfd8e3;border-right:1px solid #e3e8ef;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,3.9vh,30px);overflow:hidden;min-height:0}

#g .cg{color:#1b5e20}#g .ca{color:#0d47a1}#g .ce{color:#b71c1c}#g .cx{color:#6a1b9a}
#g .up{background:#fff4e8;color:#e65100}
#g .z.up{background:#ffead6}
#g .gl{border-left:3px solid #90a4ae}

#g .rowfl{background:#fff59d!important;transition:none}

#g .sep{background:#0b3d91;border:0}

#g .out{background:#ffcdd2!important;color:#b71c1c}
#g .dim{opacity:.45}
#g .dim input,#g .n.dim{text-decoration:line-through;text-decoration-thickness:2px}
#g .last{box-shadow:inset 4px 0 0 #ffd600}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}

@media (orientation:portrait){
 #top .sc{font-size:26px;height:42px}#top input{width:110px}
 #last{order:9;flex-basis:100%;text-align:left}
 #g{grid-template-columns:36px minmax(96px,1.2fr) repeat(5,1fr) 4px 34px .8fr}

}

.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.12);display:flex;align-items:center;gap:14px;padding:14px 16px;border-left:8px solid #90a4ae;cursor:pointer}

.card .st{font-size:15px;font-weight:700;padding:8px 12px;border-radius:8px;background:#eceff1;color:#455a64;text-align:center;min-width:130px}
.card.run .st{background:#fff3c4;color:#6d4c00}.card.live{border-left-color:#e53935}.card.live .st{background:#ffebee;color:#b71c1c;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.6}}.card.done .st{background:#e3f4e4;color:#1b5e20}
.card .st b{display:block;font-size:22px}
.card .del{border:0;background:none;font-size:24px;padding:8px 10px;opacity:.6}
#home footer{padding:10px 18px 16px;display:flex;gap:10px;flex-wrap:wrap}
#home footer .btn{font-size:18px;padding:12px 18px}
#empty{text-align:center;color:#607d8b;font-size:18px;padding:40px 10px;line-height:1.5}
body.ro #g .c{pointer-events:none}
body.ro .og,body.ro .per,body.ro #undo{display:none}
body.ro #g .nm input,body.ro #opp{pointer-events:none}
#kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:4px 0 6px}.kp{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.1);border-top:5px solid #0b3d91}.kp b{display:block;font-size:30px;color:#0b3d91;line-height:1.1}.kp span{font-size:14px;color:#546e7a}.kp small{display:block;font-size:13px;color:#78909c;margin-top:2px}.kp.g{border-top-color:#2e7d32}.kp.g b{color:#1b5e20}.kp.r{border-top-color:#c62828}.kp.r b{color:#b71c1c}.kp.o{border-top-color:#e65100}.kp.o b{color:#e65100}.kp.y{border-top-color:#f9a825}
#stab{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:18px}#stab th{background:#0b3d91;color:#fff;padding:10px 8px;font-size:15px}#stab td{padding:9px 8px;text-align:center;border-bottom:1px solid #e3e8ef}#stab td:first-child{text-align:left;font-weight:700}#stab tr:nth-child(even) td{background:#f3f6fa}#sbody h2{font-size:18px;color:#0b3d91;margin:18px 0 8px}
.mi{text-align:left;font-size:19px!important;padding:14px 16px!important}
#rob{display:none;background:#2e7d32!important}
body.ro #rob{display:inline-block}
#refv{position:fixed;inset:0;background:#111;z-index:60;display:none;flex-direction:column}#refv .rb{display:flex;gap:10px;padding:8px;align-items:center;color:#fff;font-size:18px}#refv .rb span{flex:1}#refv .rb button{font-size:20px;padding:10px 18px;border:0;border-radius:8px;background:#555;color:#fff}#refv .ri{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}#refv img{display:block;width:100%}#refv.z img{width:220%}
#home2{background:#455a64!important;font-size:22px!important}
#top{gap:6px!important}#top button{padding:0 10px!important}#last{flex:1 1 0;min-width:0}#top input{width:110px}
body.pend-g #g .c:not([data-f="g"]),body.pend-gu #g .c:not([data-f="gu"]){opacity:.25}
body.pend-g #g .c[data-f="g"],body.pend-gu #g .c[data-f="gu"]{box-shadow:inset 0 0 0 3px #ffd600;background:#fffde7!important}
#g .c.pend{background:#ffd600!important;opacity:1!important}
body.pend-g #last,body.pend-gu #last{color:#ffd600;font-weight:700;opacity:1}
</style>
</head>

<script>
(function(){
var N=15,KEY='wp_app_v2',F=['g','gu','a','au','e'];
var LBL={g:'Gol',gu:'Gol UP',a:'Assist',au:'Assist UP',e:'Espuls.',x:'Espuls. avv',og:'Gol avv',ogu:'Gol avv UP'};
function z(){var a=[];for(var i=0;i<N;i++)a.push(0);return a}
function blank(m){var o={id:'m'+Date.now(),gio:'',date:new Date().toISOString().slice(0,10),time:'',home:true,opp:'',place:'',names:[],
  g:z(),gu:z(),a:z(),au:z(),e:z(),x:z(),og:0,ogu:0,log:[],per:1,done:false,upd:0};for(var k in (m||{}))o[k]=m[k];
  while(o.names.length<N)o.names.push('');F.concat(['x']).forEach(function(f){if(!o[f]||o[f].length!=N)o[f]=z()});if(!o.log)o.log=[];return o}
function toast(t){var m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){m.style.display='none'},2600)}
function sum(a){var t=0;for(var i=0;i<a.length;i++)t+=a[i];return t}
function esc(t){return String(t||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

// ---------- archivio partite ----------
var DB=null,canSave=true;
try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){canSave=false}
if(!DB||!DB.matches)DB={matches:[],mute:false};
// recupero dati della versione precedente (una sola partita)
try{var old=JSON.parse(localStorage.getItem('wp_app_v1'));if(old&&old.log&&old.log.length&&!DB.migr){
  DB.matches.push(blank({id:'old'+(old.upd||1),opp:old.opp,names:old.names,g:old.g,gu:old.gu,a:old.a,au:old.au,e:old.e,x:old.x,og:old.og,ogu:old.ogu,log:old.log,per:old.per,date:(old.start||'').slice(0,10)||undefined}))}DB.migr=1}catch(e){}
function persist(){try{var j=JSON.stringify(DB);localStorage.setItem(KEY,j);if(localStorage.getItem(KEY)!==j)throw 0}catch(e){if(canSave){canSave=false;toast('⚠ Salvataggio non riuscito: usa "Salva copia"')}}}
function storageOk(){try{localStorage.setItem(KEY+'_t','1');return localStorage.getItem(KEY+'_t')=='1'}catch(e){return false}}
function byId(id){for(var i=0;i<DB.matches.length;i++)if(DB.matches[i].id==id)return DB.matches[i];return null}
// importa distinte: aggiunge nuove partite; aggiorna quelle non iniziate; non tocca mai statistiche già registrate
function merge(list){var n=0,u=0;list.forEach(function(m){if(!m)return;var ex=m.id?byId(m.id):null;
  if(!ex){DB.matches.push(blank(m));n++;return}
  ['gio','date','time','home','opp','place','ref'].forEach(function(k){if(m[k]!==undefined)ex[k]=m[k]});
  if(!ex.log.length&&m.names)ex.names=blank({names:m.names}).names;
  if(m.log&&m.log.length&&!ex.log.length){F.concat(['x','og','ogu','log','per','done']).forEach(function(k){if(m[k]!==undefined)ex[k]=m[k]})}
  u++});persist();return [n,u]}
// iPhone/iPad: l'app aggiunta alla Home non condivide i dati con Safari e parte dall'indirizzo salvato:
// lasciamo il codice nell'indirizzo e togliamo il manifest, così l'icona salva il link completo
var IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
try{var km=location.hash.match(/k=([0-9A-Za-z]+)/);if(km){if(DB.pin!==km[1]){DB.pin=km[1];DB.encv='';DB.statv=''}persist();
  if(IOS){var ml=document.querySelector('link[rel="manifest"]');if(ml)ml.parentNode.removeChild(ml);history.replaceState(null,'',location.pathname+'#k='+km[1])}
  else history.replaceState(null,'',location.pathname)}}catch(e){}
try{var hm=location.hash.match(/d=([^&]+)/);if(hm){var r=merge(JSON.parse(decodeURIComponent(hm[1])).matches||[]);
  history.replaceState(null,'',location.pathname);setTimeout(function(){toast('Distinte caricate: '+r[0]+' nuove, '+r[1]+' aggiornate')},300)}}catch(e){}
persist();

// ---------- distinte automatiche (file cifrato sul sito, codice squadra) ----------
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function decrypt(o,pin){var c=crypto.subtle;return c.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey'])
  .then(function(k){return c.deriveKey({name:'PBKDF2',salt:b64(o.salt),iterations:o.it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
  .then(function(key){return c.decrypt({name:'AES-GCM',iv:b64(o.iv)},key,b64(o.data))})

// ---------- riepilogo da match analyst ----------
function clean(n){return String(n||'').replace(/\s*\((VC|C)\)\s*$/,'')}
function pct(a,b){return b?Math.round(a*100/b)+'%':'–'}
function analyze(m){var s=score(m),A=s[0],B=s[1],P=[],run={t:null,n:0,best:{t:null,n:0,p:0}},d=0,maxL=0,maxD=0,ties=0,chg=0,lead=0,firstLead=null;
  for(var p=1;p<=4;p++){var a=0,b=0,ea=0,eb=0;m.log.forEach(function(e){if(e[2]!=p)return;if(e[0]=='g'||e[0]=='gu')a++;if(e[0]=='og'||e[0]=='ogu')b++;if(e[0]=='e')ea++;if(e[0]=='x')eb++});P.push({a:a,b:b,ea:ea,eb:eb})}
  m.log.forEach(function(e){var us=(e[0]=='g'||e[0]=='gu'),them=(e[0]=='og'||e[0]=='ogu');if(!us&&!them)return;var t=us?'A':'B';d+=us?1:-1;
    if(run.t==t)run.n++;else{run.t=t;run.n=1;run.p=e[2]}if(run.n>run.best.n)run.best={t:t,n:run.n,p:run.p,e:e[2]};
    maxL=Math.max(maxL,d);maxD=Math.min(maxD,d);var nl=d>0?1:d<0?-1:0;if(nl==0)ties++;if(nl!=0&&lead!=0&&nl!=lead)chg++;if(nl!=0){if(firstLead===null)firstLead=nl;lead=nl}});
  return {A:A,B:B,P:P,maxL:maxL,maxD:-maxD,ties:ties,chg:chg,run:run.best,
    gu:sum(m.gu),ga:sum(m.g),snA:sum(m.x),ogu:m.ogu,oga:m.og,snB:sum(m.e),ast:sum(m.a)+sum(m.au)}}
function hdr(m){var O=m.opp||'Avversario',s=score(m);return m.home?'Azzurra '+s[0]+' - '+s[1]+' '+O:O+' '+s[1]+' - '+s[0]+' Azzurra'}
function parz(m,P){return P.map(function(x){return m.home?x.a+'-'+x.b:x.b+'-'+x.a}).join(' / ')}
function players(m){var r=[];for(var i=0;i<N;i++)r.push({i:i,n:clean(m.names[i])||('Calotta '+(i+1)),g:m.g[i]+m.gu[i],gu:m.gu[i],a:m.a[i]+m.au[i],au:m.au[i],e:m.e[i]});return r}
function summaryShort(m){var k=analyze(m),pl=players(m),t=[];
  t.push(hdr(m)+(m.gio?' ('+m.gio+')':''));
  t.push('Parziali: '+parz(m,k.P));
  t.push('Gol in superiorità: Azzurra '+k.gu+' · '+(m.opp||'avversari')+' '+k.ogu);
  var sc=pl.filter(function(p){return p.g}).sort(function(a,b){return b.g-a.g||a.i-b.i}).map(function(p){return p.n+(p.g>1?' '+p.g:'')});
  if(sc.length)t.push('Marcatori: '+sc.join(', '));
  var as=pl.filter(function(p){return p.a}).sort(function(a,b){return b.a-a.a||a.i-b.i}).map(function(p){return p.n+(p.a>1?' '+p.a:'')});
  if(as.length)t.push('Assist: '+as.join(', '));
  return t.join('\n')}
function summaryFull(m){var k=analyze(m),pl=players(m),t=[],O=m.opp||'avversari',diff=k.A-k.B;
  t.push('AZZURRA U16'+(m.gio?' – '+m.gio:''));
  t.push(fdate(m)+(m.place?' · '+m.place:''));
  t.push(hdr(m)+(m.done?(diff>0?' · Vittoria (+'+diff+')':diff<0?' · Sconfitta ('+diff+')':' · Pareggio'):' · in corso'));
  t.push('');t.push('Parziali: '+parz(m,k.P));
  var w=0,l=0,x=0;k.P.forEach(function(q){if(q.a>q.b)w++;else if(q.a<q.b)l++;else x++});
  t.push('Tempi vinti '+w+', pareggiati '+x+', persi '+l);
  if(k.A+k.B){t.push('');t.push('ANDAMENTO');
    t.push('Vantaggio massimo Azzurra: '+(k.maxL?'+'+k.maxL:'mai in vantaggio')+(k.maxD?' · Svantaggio massimo: -'+k.maxD:''));
    if(k.run.n>=2)t.push('Miglior parziale '+(k.run.t=='A'?'Azzurra':O)+': '+k.run.n+'-0'+(k.run.p==k.run.e?' nel '+k.run.p+'° tempo':' tra '+k.run.p+'° e '+k.run.e+'° tempo'));
    t.push('Situazioni di parità: '+k.ties+' · Cambi di vantaggio: '+k.chg)}
  t.push('');t.push('ATTACCO');
  t.push('Gol '+k.A+': '+k.ga+" d'azione, "+k.gu+' in superiorità'+(k.A?' ('+pct(k.gu,k.A)+' dei gol)':''));
  t.push('Gol con assist: '+Math.min(k.ast,k.A)+' su '+k.A+(k.A?' ('+pct(Math.min(k.ast,k.A),k.A)+')':''));
  t.push('Marcatori diversi: '+pl.filter(function(p){return p.g}).length);
  t.push('');t.push('DIFESA');
  t.push('Gol subiti '+k.B+': '+k.oga+" d'azione, "+k.ogu+' in inferiorità'+(k.B?' ('+pct(k.ogu,k.B)+' dei gol subiti)':''));
  t.push('Bilancio in superiorità: '+(k.gu-k.ogu>0?'+':'')+(k.gu-k.ogu)+" · bilancio d'azione: "+(k.ga-k.oga>0?'+':'')+(k.ga-k.oga));
  var sc=pl.filter(function(p){return p.g||p.a}).sort(function(a,b){return (b.g+b.a)-(a.g+a.a)||b.g-a.g||a.i-b.i});
  if(sc.length){t.push('');t.push('CONTRIBUTO OFFENSIVO (gol + assist)');
    sc.forEach(function(p){var x=[];if(p.g)x.push(p.g+' gol'+(p.gu?' ('+p.gu+' in sup.)':''));if(p.a)x.push(p.a+' assist'+(p.au?' ('+p.au+' in sup.)':''));t.push((p.i+1)+' '+p.n+': '+x.join(', '))})}
  var ex=pl.filter(function(p){return p.e}).sort(function(a,b){return b.e-a.e||a.i-b.i});
  t.push('');t.push('ESPULSIONI (falli personali)');
  t.push('Azzurra '+k.snB+' · '+O+' '+k.snA);
  t.push('Per tempo (Azzurra-'+O+'): '+k.P.map(function(q){return q.ea+'-'+q.eb}).join(' / '));
  ex.forEach(function(p){t.push((p.i+1)+' '+p.n+': '+p.e+(p.e>=3?' – fuori per limite falli':p.e==2?' – a rischio':''))});
    return t.join('\n')}
function summary(){return smode=='b'?summaryShort(S):summaryFull(S)}

function csv(){var r=['Calotta;Nome;Gol;Gol UP;Assist;Assist UP;Espulsioni;Espulsioni avv'];
  for(var i=0;i<N;i++)r.push([i+1,'"'+(S.names[i]||'').replace(/"/g,"'")+'"',S.g[i],S.gu[i],S.a[i],S.au[i],S.e[i],S.x[i]].join(';'));
  r.push('');r.push('Avversario;'+(S.opp||'')+';Gol avv;'+S.og+';Gol avv UP;'+S.ogu);
  r.push('');r.push('Evento;Calotta;Tempo;Ora');
  S.log.forEach(function(e){r.push([LBL[e[0]],e[1]>=0?e[1]+1:'',e[2],new Date(e[3]).toLocaleTimeString('it-IT')].join(';'))});
  return '\ufeff'+r.join('\r\n')}
