<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Azzurra U16 · Diretta</title>
<style>
:root{--blue:#0A84FF;--red:#FF3B30;--glass:rgba(28,28,30,.55)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.card{width:min(420px,100%);padding:22px;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 .5px rgba(255,255,255,.25),0 20px 50px rgba(0,0,0,.5);text-align:center}
h1{font-size:22px;margin:0 0 6px}
p{opacity:.8;font-size:15px;line-height:1.4;margin:6px 0}
input{width:100%;margin-top:14px;padding:13px 14px;border-radius:14px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;text-align:center;letter-spacing:.06em}
button{width:100%;margin-top:12px;min-height:50px;border:0;border-radius:999px;background:var(--blue);color:#fff;font-size:17px;font-weight:600}
.err{color:#FF9F0A;font-size:14px;min-height:20px;margin-top:8px}
#player{display:none;width:100%;max-width:1280px}
video{width:100%;aspect-ratio:16/9;background:#111;border-radius:14px;display:block}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 4px 0;font-size:15px}
.live{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--red);font-weight:700;font-size:13px}
.off{background:rgba(255,255,255,.18)}
.dot{width:8px;height:8px;border-radius:50%;background:#fff}
#msg{opacity:.8}
small{opacity:.55;font-size:12px}
.tv{display:none;align-items:center;gap:8px;margin:10px 4px 0;font-size:15px}
.tv google-cast-launcher{width:34px;height:34px;--connected-color:#0A84FF;--disconnected-color:#fff;cursor:pointer}
.tvhelp{opacity:.6;font-size:13px;margin:8px 4px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="gate">
    <h1>Azzurra U16 · Diretta</h1>
    <p>Inserisci il codice che trovi nel gruppo dei genitori.</p>
    <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="codice">
    <button id="go">Guarda la partita</button>
    <div class="err" id="err"></div>
  </div>
  <div id="player">
    <video id="v" controls playsinline muted autoplay x-webkit-airplay="allow"></video>
    <div class="bar"><span class="live off" id="badge"><span class="dot"></span><span id="badgeTxt">NON IN DIRETTA</span></span><span id="msg"></span></div>
    <div class="tv" id="tvRow"><google-cast-launcher></google-cast-launcher><span id="tvTxt">Guarda sulla TV (Chromecast)</span></div>
    <div class="tvhelp" id="tvHelp"></div>
    <div class="bar"><small>Il video è riservato ai genitori: per favore non condividere il link fuori dal gruppo.</small></div>
  </div>
</div>
<script>
// Configurazione cifrata: l'indirizzo del video si apre solo con il codice giusto (PBKDF2-SHA256 + AES-GCM).
// Si genera con tools/diretta_cfg.py. Vuota = diretta non ancora configurata.
const CFG = [{"s": "iUkM8jyZ2QvpluHpj22deQ==", "iv": "1nWfMxgH23ByJtuF", "d": "nI4l394ppdAa0E++iQu3KNhzUkdb4ZTxFSSoBqp5aOUKZnbjV9xk0YKprfguTTUKX6uDZRwPUgxGDb7VTswb+mmK0SKNPl7oJNH9fgqNDVJ7Mmg0Dqc0RwoATmIVG4pxBjeEGgbDmvvURwYDTYGwoj+ymIr6WwmSMkX0bqciGPNJlw=="}];
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openCfg(code) {
  for (const c of CFG) {
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(c.s), iterations: 150000, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(c.iv)}, key, b64(c.d));
      return JSON.parse(new TextDecoder().decode(plain));
    } catch (e) {}
  }
  return null;
}
let hls = null, src = '', srcs = [];
function badge(on, text) { $('badge').classList.toggle('off', !on); $('badgeTxt').textContent = on ? 'IN DIRETTA' : 'NON IN DIRETTA'; $('msg').textContent = text || ''; }
async function isLive(src) {
  // Cloudflare Stream: /lifecycle dice se la diretta è in onda; altrimenti si guarda se il manifest è una playlist vera.
  const life = src.includes('/manifest/') ? src.replace(/\/manifest\/.*$/, '/lifecycle') : '';
  if (life) { try { const r = await fetch(life + '?t=' + Date.now(), {cache: 'no-store'}); if (r.ok) { const j = await r.json(); return !!j.live; } } catch (e) {} }
  try { const r = await fetch(src + (src.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache: 'no-store'}); return r.status === 200 && (await r.text()).includes('#EXT'); } catch (e) { return false; }
}
// TV: AirPlay da iPhone/iPad (pulsante nel lettore di Safari), Chromecast da Chrome (Android, PC).
const isApple = /iPhone|iPad|Macintosh/.test(navigator.userAgent) && 'WebKitPlaybackTargetAvailabilityEvent' in window;
function tvHelp() {
  $('tvHelp').textContent = isApple ? 'Per la TV: metti il video a schermo intero e tocca il simbolo AirPlay (Apple TV o TV compatibili).'
    : 'Per la TV con Chromecast o Google TV usa Chrome; con altre TV usa "Duplica schermo" del telefono.';
}
function castMedia() {
  const s = cast.framework.CastContext.getInstance().getCurrentSession();
  if (!s || !src) return;
  const mi = new chrome.cast.media.MediaInfo(src, 'application/x-mpegurl');
  mi.streamType = chrome.cast.media.StreamType.LIVE;
  mi.hlsSegmentFormat = chrome.cast.media.HlsSegmentFormat.TS;
  mi.metadata = new chrome.cast.media.GenericMediaMetadata(); mi.metadata.title = 'Azzurra U16 · Diretta';
  const rq = new chrome.cast.media.LoadRequest(mi); rq.autoplay = true;
  s.loadMedia(rq).then(() => { $('tvTxt').textContent = 'In onda sulla TV'; }, () => { $('tvTxt').textContent = 'La TV non riesce ad aprire il video'; });
}
window.__onGCastApiAvailable = ok => {
  if (!ok) return;
  const ctx = cast.framework.CastContext.getInstance();
  ctx.setOptions({receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID, autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED});
  ctx.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED, e => {
    const st = e.castState;
    $('tvRow').style.display = st === 'NO_DEVICES_AVAILABLE' ? 'none' : 'flex';
    if (st === 'CONNECTED') castMedia(); else $('tvTxt').textContent = 'Guarda sulla TV (Chromecast)';
  });
};
if (!isApple) { const s = document.createElement('script'); s.src = 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1'; document.head.appendChild(s); }
function play() {
  const v = $('v');
  if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = src; v.play().catch(() => {}); return; }
  const start = () => { if (hls) hls.destroy(); hls = new Hls({liveSyncDurationCount: 3}); hls.loadSource(src); hls.attachMedia(v); hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {})); };
  if (window.Hls) start();
  else { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js'; s.onload = start; document.head.appendChild(s); }
}
let playing = false;
// Più servizi (Mux, Gcore): si guarda quale è in onda e si mostra quello; se si passa dall'uno all'altro la pagina segue.
async function loop() {
  let live = '';
  for (const s of srcs) { if (await isLive(s)) { live = s; break; } }
  const on = !!live;
  if (on && playing && live !== src) { playing = false; if (hls) { hls.destroy(); hls = null; } }
  if (on) src = live;
  if (on && !playing) { playing = true; badge(true, ''); play(); }
  else if (on) badge(true, '');
  else { if (playing) { playing = false; $('v').removeAttribute('src'); if (hls) { hls.destroy(); hls = null; } } badge(false, 'La partita non è ancora iniziata: la pagina si collega da sola.'); }
  setTimeout(loop, on ? 30000 : 15000);
}
async function enter(code) {
  code = (code || '').trim().toUpperCase();
  if (!code) return;
  if (!CFG.length) { $('err').textContent = 'La diretta non è ancora attiva.'; return; }
  $('err').textContent = 'Controllo il codice…';
  const cfg = await openCfg(code);
  if (!cfg || !(cfg.hls || (cfg.sources && cfg.sources.length))) { $('err').textContent = 'Codice non valido.'; return; }
  srcs = cfg.sources ? cfg.sources.map(x => x.hls) : [cfg.hls];
  history.replaceState(null, '', '#k=' + encodeURIComponent(code));
  $('gate').style.display = 'none'; $('player').style.display = 'block'; tvHelp();
  loop();
}
$('go').onclick = () => enter($('code').value);
$('code').onkeydown = e => { if (e.key === 'Enter') enter($('code').value); };
const m = location.hash.match(/k=([^&]+)/);
if (m) { $('code').value = decodeURIComponent(m[1]); enter($('code').value); }
</script>
</body>
</html>
